<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar project</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: bisque;
        }
        .nav-container{
            margin-bottom: 40px;
            }
        h2{
            margin-bottom: 10px;
        }
        .nav1{
            background-color: #e4bebe;
            padding: 10px;

        }
        .nav1 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        .nav1 li{
            display: inline;

        }
        .nav1 a{
            text-decoration: none;
            color: #1a1a1a;
            background-color: #ab7373;
            padding: 5px 15px;
            position: relative;
        }

        .nav1 a::after{
            content: "";
            position: absolute;
            height: 2px;
            width: 100%;
            left: 0;
            bottom: 0;
            background-color: #3c0a0a;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
        }

        .nav1 a:hover::after{
            transform: scaleX(1);
        }

        .nav1 .Login-btn{
            background-color: #9b3d3d;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

.nav2{
    background-color: #608555;
    padding: 20px;
    width: 200px;
}

.nav2 ul{
    list-style-type: none;
    margin: 0;
    padding: 0;
    /* display: flex;
    justify-content: ; */
    /* color: alicebluess; */

}

.nav2 li{
    margin-bottom: 20px;
}

.nav2 a{
    text-decoration: none;
    color: aliceblue;
    display: block;
    /* background-color: #ab7373; */
    padding: 10px;
    width: 100%;
    /* position: relative; */
}

 .nav2 a:hover{
            background-color: #137e0a;
        }

 .nav2 .Login-btn{
            background-color: #17642e;
            text-align: center;
            border: none;
            width: 100%;
            padding: 10px;
            /* border-radius: 5px; */
            cursor: pointer;
        }
        .nav2 .Login-btn:hover{
            background-color: #e6ecc8;
        }

        .nav3{
            background-color: #ccd7db;
            padding: 10px;

        }
        .nav3 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        /* .nav3 li{
            display: inline;

        } */
        .nav3 a{
            text-decoration: none;
            color: #1a1a1a;
            background-color: #5a8584;
            padding: 10px;  
            display: block;
        }
        .nav3 .dropdown-content{
            display: none;
        }

        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: #3e3e3e;

        }
    </style>
</head>
<body>
    <div class="nav-container">
        <h2>Variation 1: Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="Login-btn">Login</button></li>
            </ul>
        </nav>
    </div>

    <div class="nav-container">
        <h2>Variation 2: Vertical with hover effect</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                
            </ul>
            <button class="Login-btn">Login</button>
        </nav>
    </div>

     <div class="nav-container">
      <h2>Variation 3: Horizontal with dropdown</h2>
      <nav class="nav3">
        <ul>
          <li><a href="#">Home</a></li>
          <li class="dropdown">
            <a href="#">About</a>
            <div class="dropdown-content">
              <a href="#">Our Story</a>
              <a href="#">Team</a>
              <a href="#">Contact</a>
            </div>
          </li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
