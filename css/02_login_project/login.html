<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            height: 100vh;
            /* vh - viewport height - changes with screen size (100 vh - 100% of screen) */
            display: flex;
            /* flex (flexbox)- to decide kaha pe rkhna h as in which part of the screen */
            justify-content: center;
            align-items: center;
        }
        .card{
            background-color: #817d7d;
            border-radius: 8px;
            /* border radius to make edges of the light grey box rounded */
            padding: 20px;
            /* padding to give breathing room */
            width: 300px;

        }
        h2{
            color: #840b3b;
            text-align: center;
            margin-bottom: 20px;
        }
        form{
            display: flex;
            flex-direction: column;
            
        }
        input{
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid black;
            background-color: #e8bbce;
        }
        button{
            background-color: #7e0437;
            color: white;
            padding: 10px;
            border-radius: 8px;
        }
        button:hover{
            background-color: #350413;
        }
    </style>
</head>
<body>
    <!-- div.card -->
    <div class="card">
        <h2>Login</h2>
        <form action="">
            <input type="email" name="" id="" placeholder="Email">
            <input type="password" name="" id="" placeholder="Password">
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
